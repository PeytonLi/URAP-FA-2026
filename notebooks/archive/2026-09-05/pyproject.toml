[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-evidence-september5"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["certifi==2026.7.22", "matplotlib==3.10.5", "numpy==2.2.6", "pillow==11.3.0", "vaderSentiment==3.3.2"]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.8"]
report = ["reportlab==4.4.3", "pypdf==6.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data/private", "reference"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
